name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version

      - name: Use latest npm
        run: npm i -g npm@latest

      - name: Guard - ensure no npm token env is set
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ] || [ -n "${NPM_TOKEN:-}" ]; then
            echo "Token env var detected (NODE_AUTH_TOKEN/NPM_TOKEN). Remove it for OIDC trusted publishing."
            exit 1
          fi

      - name: Clear npm config files (avoid token/always-auth config)
        run: |
          rm -f ~/.npmrc .npmrc

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          [[ "$PKG_VERSION" == "$TAG" ]] || { echo "Tag v$TAG != package.json $PKG_VERSION"; exit 1; }

      - name: Install deps
        run: yarn install --immutable

      - name: Build (single source of truth)
        run: yarn clean && yarn test && yarn build

      - name: Safety check - show publish contents
        run: npm pack --dry-run

      - name: Publish (Trusted Publishing attaches provenance automatically)
        run: npm publish --access public --ignore-scripts
